<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:,">
  <title></title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    video {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: fill;
      background: #000;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #fff;
      background: #000;
      font: 14px system-ui, sans-serif;
      letter-spacing: .04em;
      z-index: 2;
      transition: opacity .2s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="loading">Loading</div>
  <video id="bg" autoplay muted loop playsinline webkit-playsinline preload="auto">
    <source src="./background.mp4" type="video/mp4">
  </video>
  <script>
    const video = document.getElementById("bg");
    const loading = document.getElementById("loading");
    let soundEnabled = false;

    function hideLoading() {
      loading.classList.add("hidden");
      window.setTimeout(() => loading.remove(), 250);
    }

    video.addEventListener("canplay", hideLoading, { once: true });
    video.addEventListener("playing", hideLoading, { once: true });
    video.addEventListener("error", () => {
      loading.textContent = "Video unavailable";
    });

    video.play().catch(() => {});

    // Mobile browsers block autoplay with sound. The first tap enables audio.
    async function enableSound() {
      if (soundEnabled) return;
      soundEnabled = true;
      video.muted = false;
      try {
        await video.play();
      } catch (_) {
        video.muted = true;
        soundEnabled = false;
      }
      document.removeEventListener("pointerdown", enableSound);
      document.removeEventListener("click", enableSound);
    }
    document.addEventListener("pointerdown", enableSound, { once: true });
    document.addEventListener("click", enableSound, { once: true });

    // Request landscape where the browser supports orientation locking.
    async function requestLandscape() {
      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock("landscape");
        }
      } catch (_) {}
    }
    document.addEventListener("pointerdown", requestLandscape, { once: true });
  </script>
</body>
</html>
