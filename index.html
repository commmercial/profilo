<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:,">
  <title></title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; }
    video {
      position:fixed; top:50%; left:50%; display:block;
      width:100vw; height:100vh; height:100dvh;
      transform:translate(-50%,-50%);
      object-fit:fill; background:#000;
      opacity:1; transition:opacity .8s ease;
    }
    @media (max-width: 900px) and (pointer: coarse) {
      video {
        width:100vw; height:100dvh;
        transform:translate(-50%,-50%);
        object-fit:contain;
        opacity:0;
      }
      video.visible { opacity:1; }
    }
    #loading {
      position:fixed; inset:0; z-index:2; display:grid; place-items:center;
      color:#fff; background:#000; font:14px system-ui,sans-serif;
      transition:opacity .4s ease; pointer-events:none;
    }
    #loading.hide { opacity:0; }
    #sound-toggle {
      position:fixed; z-index:3; right:20px; bottom:20px;
      border:1px solid rgba(255,255,255,.35); border-radius:999px;
      padding:10px 14px; color:#fff; background:rgba(0,0,0,.65);
      font:14px system-ui,sans-serif; cursor:pointer;
    }
    #sound-toggle:focus-visible { outline:2px solid #fff; outline-offset:3px; }
  </style>
</head>
<body>
  <div id="loading">Loading</div>
  <video id="video" autoplay muted loop playsinline webkit-playsinline preload="auto"></video>
  <button id="sound-toggle" type="button" aria-pressed="false">Enable sound</button>
  <script>
    const video = document.getElementById("video");
    const loading = document.getElementById("loading");
    const mobile = matchMedia("(max-width: 900px) and (pointer: coarse)").matches;
    let introFinished = true;
    let videoReady = false;

    function revealVideo() {
      if (!introFinished || !videoReady) return;
      video.classList.add("visible");
      loading.classList.add("hide");
      setTimeout(() => loading.remove(), 450);
    }

    video.addEventListener("canplay", () => {
      videoReady = true;
      revealVideo();
    }, { once:true });
    video.addEventListener("playing", () => { videoReady = true; revealVideo(); }, { once:true });
    video.addEventListener("error", () => { loading.textContent = "Video unavailable"; });

    const soundToggle = document.getElementById("sound-toggle");

    soundToggle.addEventListener("click", async () => {
      const enableSound = video.muted;
      video.muted = !enableSound;
      video.defaultMuted = !enableSound;
      video.volume = 1;
      soundToggle.textContent = enableSound ? "Mute" : "Enable sound";
      soundToggle.setAttribute("aria-pressed", String(enableSound));
      if (enableSound) {
        try {
          await video.play();
        } catch (_) {
          video.muted = true;
          video.defaultMuted = true;
          soundToggle.textContent = "Enable sound";
          soundToggle.setAttribute("aria-pressed", "false");
        }
      }
    });

    async function loadVideo() {
      try {
        const response = await fetch("https://api.github.com/repos/commmercial/profilo/contents/?ref=main");
        if (!response.ok) throw new Error("Repository listing failed");
        const files = await response.json();
        const mp4 = files.find(file => file.type === "file" && /\.mp4$/i.test(file.name));
        if (!mp4) throw new Error("No MP4 found in repository root");
        video.src = "./" + encodeURIComponent(mp4.name);
        video.load();
        video.play().catch(() => {});
      } catch (_) {
        loading.textContent = "Video unavailable";
      }
    }

    if (mobile) {
      revealVideo();
    } else {
      video.classList.add("visible");
    }



    loadVideo();
  </script>
</body>
</html>
