<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:,">
  <title></title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; }
    video {
      position:fixed; top:50%; left:50%; display:block;
      width:100vw; height:100vh; height:100dvh;
      transform:translate(-50%,-50%);
      object-fit:fill; background:#000;
      opacity:1; transition:opacity .8s ease;
    }
    @media (max-width: 900px) and (pointer: coarse) {
      video {
        width:100vw; height:100dvh;
        transform:translate(-50%,-50%);
        object-fit:contain;
        opacity:0;
      }
      video.visible { opacity:1; }
    }
    #intro {
      position:fixed; inset:0; z-index:5;
      display:none; place-items:center; align-content:center; gap:22px;
      background:#000; color:#fff; font:500 16px system-ui,sans-serif;
      letter-spacing:.04em; text-align:center;
      transition:opacity .8s ease;
    }
    #intro.show { display:grid; }
    #intro.hide { opacity:0; pointer-events:none; }
    #loading {
      position:fixed; inset:0; z-index:2; display:grid; place-items:center;
      color:#fff; background:#000; font:14px system-ui,sans-serif;
      transition:opacity .4s ease; pointer-events:none;
    }
    #loading.hide { opacity:0; }
  </style>
</head>
<body>
  <div id="intro"><div>Turn phone sideways</div></div>
  <div id="loading">Loading</div>
  <video id="video" autoplay muted loop playsinline webkit-playsinline preload="auto"></video>
  <script>
    const video = document.getElementById("video");
    const intro = document.getElementById("intro");
    const loading = document.getElementById("loading");
    const mobile = matchMedia("(max-width: 900px) and (pointer: coarse)").matches;
    let introFinished = !mobile;
    let videoReady = false;
    let audioUnlocked = false;

    function revealVideo() {
      if (!introFinished || !videoReady) return;
      video.classList.add("visible");
      loading.classList.add("hide");
      setTimeout(() => loading.remove(), 450);
    }

    video.addEventListener("canplay", () => { videoReady = true; revealVideo(); }, { once:true });
    video.addEventListener("playing", () => { videoReady = true; revealVideo(); }, { once:true });
    video.addEventListener("error", () => { loading.textContent = "Video unavailable"; });

    function startWithSound() {
      // iOS Safari needs play() called directly inside a user gesture.
      if (!video.src) return;
      video.defaultMuted = false;
      video.muted = false;
      video.removeAttribute("muted");
      video.volume = 1;
      const attempt = video.play();
      if (attempt && typeof attempt.then === "function") {
        attempt.then(() => { audioUnlocked = true; })
          .catch(() => { audioUnlocked = false; });
      } else {
        audioUnlocked = true;
      }
    }

    async function loadVideo() {
      try {
        const response = await fetch("https://api.github.com/repos/commmercial/profilo/contents/?ref=main");
        if (!response.ok) throw new Error("Repository listing failed");
        const files = await response.json();
        const mp4 = files.find(file => file.type === "file" && /\.mp4$/i.test(file.name));
        if (!mp4) throw new Error("No MP4 found in repository root");
        video.src = "./" + encodeURIComponent(mp4.name);
        video.load();
        if (!mobile) video.play().catch(() => {});
      } catch (_) {
        loading.textContent = "Video unavailable";
      }
    }

    if (mobile) {
      intro.classList.add("show");

      setTimeout(() => {
        introFinished = true;
        intro.classList.add("hide");
        setTimeout(() => intro.remove(), 850);
        if (!video.paused) video.play().catch(() => {});
        revealVideo();
      }, 3000);
    } else {
      video.classList.add("visible");
    }

    // A real tap/click anywhere enables sound on iPhone and Android browsers.
    document.addEventListener("click", startWithSound, { capture:true });
    document.addEventListener("touchend", startWithSound, { capture:true, passive:true });
    loadVideo();
  </script>
</body>
</html>
