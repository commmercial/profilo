<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:,">
  <title></title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; min-height: 100%;
      margin: 0; overflow: hidden; background: #000;
    }
    video {
      position: fixed; top: 50%; left: 50%; display: block;
      width: 100vw; height: 100vh; height: 100dvh;
      transform: translate(-50%, -50%);
      object-fit: fill; background: #000;
    }
    @media (max-width: 900px) and (pointer: coarse) {
      video {
        width: 100dvh; height: 100vw;
        transform: translate(-50%, -50%) rotate(90deg);
      }
    }
    #loading, #start {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #fff; background: #000;
      font: 15px system-ui, sans-serif; letter-spacing: .03em;
      z-index: 3; text-align: center; padding: 24px;
    }
    #loading { transition: opacity .2s ease; }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #start { gap: 14px; align-content: center; }
    #start[hidden] { display: none; }
    #start button {
      color: #fff; background: transparent; border: 1px solid #777;
      border-radius: 999px; padding: 11px 20px;
      font: inherit; cursor: pointer;
    }
    #hint { opacity: .8; font-size: 13px; }
    @media (hover: hover) and (pointer: fine) {
      #start { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="loading">Loading</div>
  <div id="start" hidden>
    <div id="message">Turn your phone sideways</div>
    <div id="hint">Then tap below to start with sound</div>
    <button id="startButton" type="button">Start video</button>
  </div>
  <video id="video" autoplay muted loop playsinline webkit-playsinline preload="auto"></video>
  <script>
    const video = document.getElementById("video");
    const loading = document.getElementById("loading");
    const start = document.getElementById("start");
    const message = document.getElementById("message");
    const hint = document.getElementById("hint");
    const isMobile = matchMedia("(pointer: coarse)").matches;
    let started = false;

    function isLandscape() {
      return window.innerWidth > window.innerHeight;
    }

    function updateOrientationPrompt() {
      if (!isMobile || started) return;
      start.hidden = false;
      message.textContent = isLandscape() ? "Ready?" : "Turn your phone sideways";
      hint.textContent = isLandscape()
        ? "Tap below to start the video with sound"
        : "Then tap below to start with sound";
    }

    async function loadVideo() {
      try {
        const response = await fetch("https://api.github.com/repos/commmercial/profilo/contents/?ref=main");
        if (!response.ok) throw new Error("Could not list repository files");
        const files = await response.json();
        const mp4 = files.find(file => file.type === "file" && /\.mp4$/i.test(file.name));
        if (!mp4) throw new Error("No MP4 file found in the repository root");
        video.src = "./" + encodeURIComponent(mp4.name);
        video.load();
        if (!isMobile) video.play().catch(() => {});
        updateOrientationPrompt();
      } catch (error) {
        loading.textContent = "Video unavailable";
      }
    }

    function hideLoading() {
      loading.classList.add("hidden");
      window.setTimeout(() => loading.remove(), 250);
    }
    video.addEventListener("canplay", hideLoading, { once: true });
    video.addEventListener("playing", hideLoading, { once: true });
    video.addEventListener("error", () => { loading.textContent = "Video unavailable"; });

    document.getElementById("startButton").addEventListener("click", async () => {
      if (!isLandscape()) {
        updateOrientationPrompt();
        return;
      }
      started = true;
      start.hidden = true;
      video.muted = false;
      try { await video.play(); }
      catch (_) { video.muted = true; started = false; start.hidden = false; }
    });

    window.addEventListener("resize", updateOrientationPrompt);
    window.addEventListener("orientationchange", updateOrientationPrompt);

    if (isMobile) updateOrientationPrompt();
    loadVideo();
  </script>
</body>
</html>
