<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:,">
  <title></title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; }
    video {
      position:fixed; top:50%; left:50%; display:block;
      width:100vw; height:100vh; height:100dvh;
      transform:translate(-50%,-50%);
      object-fit:fill; background:#000;
      opacity:1; transition:opacity .8s ease;
    }
    @media (max-width: 900px) and (pointer: coarse) {
      video {
        width:100vw; height:100dvh;
        transform:translate(-50%,-50%);
        object-fit:contain;
        opacity:0;
      }
      video.visible { opacity:1; }
    }
    #start-screen {
      position:fixed; inset:0; z-index:3; display:grid; place-items:center;
      background:rgba(0,0,0,.48); transition:opacity 1.2s ease;
    }
    #start-screen.hidden { opacity:0; pointer-events:none; }
    #play-button {
      border:2px outset #d8e4f0; border-radius:0;
      padding:12px 28px; color:#fff;
      background:linear-gradient(#4f85bd,#17436f);
      box-shadow:inset 1px 1px 0 rgba(255,255,255,.45), 2px 2px 0 #111;
      font:bold 16px Arial,sans-serif; text-shadow:1px 1px #17334f;
      cursor:pointer;
    }
    #play-button:hover:not(:disabled) { background:linear-gradient(#659bd1,#255987); }
    #play-button:active:not(:disabled) { border-style:inset; }
    #play-button:disabled { opacity:.8; cursor:wait; }
    #play-button:disabled::after {
      content:""; display:block; height:6px; margin-top:9px;
      border:1px solid #b5c6d6;
      background:repeating-linear-gradient(90deg,#b5c6d6 0 12px,#31577c 12px 24px);
      background-size:48px 100%;
      animation:loading-stripes 2.4s linear infinite;
    }
    #play-button:focus-visible { outline:2px solid #fff; outline-offset:4px; }
    @keyframes loading-stripes { to { background-position:48px 0; } }
  </style>
</head>
<body>
  <div id="start-screen">
    <button id="play-button" type="button" disabled>Loading video…</button>
  </div>
  <video id="video" loop playsinline webkit-playsinline preload="auto"></video>
  <script>
    const video = document.getElementById("video");
    const startScreen = document.getElementById("start-screen");
    const playButton = document.getElementById("play-button");
    let videoReady = false;
    let mediaCanPlay = false;
    const minimumLoadingMs = 5000;
    const loadingStartedAt = performance.now();

    video.addEventListener("canplay", () => {
      mediaCanPlay = true;
      const remainingLoadingMs = Math.max(0, minimumLoadingMs - (performance.now() - loadingStartedAt));
      window.setTimeout(() => {
        if (!mediaCanPlay) return;
        videoReady = true;
        video.classList.add("visible");
        playButton.disabled = false;
        playButton.textContent = "Play video";
      }, remainingLoadingMs);
    }, { once:true });
    video.addEventListener("error", () => {
      mediaCanPlay = false;
      playButton.textContent = "Video unavailable";
      playButton.disabled = true;
    });

    playButton.addEventListener("click", () => {
      if (!videoReady) return;
      video.muted = false;
      video.defaultMuted = false;
      video.removeAttribute("muted");
      video.volume = 1;
      const playback = video.play();
      startScreen.classList.add("hidden");
      playback.catch(() => {
        startScreen.classList.remove("hidden");
        playButton.textContent = "Tap to play";
      });
    });

    async function loadVideo() {
      try {
        const response = await fetch("https://api.github.com/repos/commmercial/profilo/contents/?ref=main");
        if (!response.ok) throw new Error("Repository listing failed");
        const files = await response.json();
        const mp4 = files.find(file => file.type === "file" && /\.mp4$/i.test(file.name));
        if (!mp4) throw new Error("No MP4 found in repository root");
        video.src = "./" + encodeURIComponent(mp4.name);
        video.load();
      } catch (_) {
        playButton.textContent = "Video unavailable";
        playButton.disabled = true;
      }
    }

    loadVideo();
  </script>>
</body>
</html>
